name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: tenant_svc
          POSTGRES_PASSWORD: tenant_svc_dev
          POSTGRES_DB: tenant_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenant_svc -d tenant_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TENANT_SVC_DATABASE_URL: postgres://tenant_svc:tenant_svc_dev@localhost:5432/tenant_db?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"

      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: 1.74.0
          setup_only: true

      - name: Lint
        run: make lint

      - name: Generated code is up to date
        run: make generate-check

      - name: Test
        run: go test ./... -count=1

      - name: Build image
        run: docker build -t ngumbah-tenant-svc:ci .
